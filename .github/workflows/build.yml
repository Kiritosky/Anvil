name: Build

# Der einzige Zweck dieses Workflows: echte Compiler-Fehler sichtbar machen.
# Entwickelt wird hier ohne Swift-Toolchain, also ist der Runner die einzige
# Stelle, an der der Code tatsächlich übersetzt wird.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Bauen und testen
    # Anvil setzt macOS 26 voraus (FoundationModels, SpeechAnalyzer). Gibt es
    # dieses Label noch nicht, schlägt der Job beim Einplanen fehl — dann ist
    # macos-15 die nächstbeste Wahl, prüft aber nur AnvilKit und AnvilUI.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain zeigen
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Bibliotheken testen
        run: swift test

      - name: App bauen
        run: |
          xcodebuild build \
            -project Anvil.xcodeproj \
            -scheme Anvil \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY=- \
            | tee build.log | grep -E '^(\*\*|.*error:)' || true
          grep -q '\*\* BUILD SUCCEEDED \*\*' build.log

      - name: Bundle prüfen
        run: |
          BUILT="$(xcodebuild -project Anvil.xcodeproj -scheme Anvil -configuration Debug \
            -showBuildSettings 2>/dev/null | awk -F' = ' '/ BUILT_PRODUCTS_DIR /{print $2; exit}')"
          APP="$BUILT/Anvil.app"
          test -x "$APP/Contents/MacOS/Anvil"
          test -f "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/en.lproj/Localizable.strings"
          test -f "$APP/Contents/Resources/Assets.car"
          echo "Bundle vollständig: $APP"

      - name: Icon ist aktuell
        # Die PNGs im Asset-Katalog sind eingecheckt, gezeichnet werden sie vom
        # Skript. Läuft beides auseinander, merkt es sonst niemand.
        run: |
          swift Scripts/make-icon.swift
          git diff --exit-code -- Resources/Assets.xcassets

  translations:
    name: Übersetzungen prüfen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Lücken suchen
        run: python3 Scripts/check-translations.py

  toolList:
    name: Werkzeugliste prüfen
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Liste mit dem Quelltext vergleichen
        run: python3 Scripts/tool-list.py --check
